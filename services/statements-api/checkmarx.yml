# Consumed by the mock cx CLI in platform-tooling/mock-scanners/bin. Inherits the platform-services
# root checkmarx.yml; only the per-service overrides live here.
project:
  name: meridian-platform-services-statements-api
  team: /CxServer/Meridian/CSWT/payments-platform
scan:
  preset: Meridian-High-And-Medium
  incremental: true
  language: python
  source: .
  exclude:
    - "__pycache__"
thresholds:
  high: 0
  medium: 5

report:
  formats: [json, html]
  output: .cx-reports
