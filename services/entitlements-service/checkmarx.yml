# Consumed by the mock cx CLI in platform-tooling/mock-scanners/bin. Inherits the platform-services
# root checkmarx.yml; only the per-service overrides live here.
project:
  name: meridian-platform-services-entitlements-service
  team: /CxServer/Meridian/CSWT/identity-platform
scan:
  preset: Meridian-High-And-Medium
  incremental: true
  language: java
  source: .
  exclude:
    - "target"
thresholds:
  high: 0
  medium: 5

report:
  formats: [json, html]
  output: .cx-reports
