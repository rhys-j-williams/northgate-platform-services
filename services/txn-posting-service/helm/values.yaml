replicaCount: 1
image:
  repository: registry.meridian.internal/cswt/txn-posting-service
  tag: "4.1.7"
  pullPolicy: IfNotPresent
service:
  port: 4512
resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 1536Mi
probes:
  path: /actuator/health
  initialDelaySeconds: 45
env:
  LOG_LEVEL: info
  SPLUNK_HEC_URL: http://splunk-hec-mock:4606/services/collector
  SPRING_PROFILES_ACTIVE: local,local-artemis
vault:
  role: txn-posting-service
  secretsPath: secret/data/cswt/txn-posting-service
