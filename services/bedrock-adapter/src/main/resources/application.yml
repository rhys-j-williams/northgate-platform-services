spring:
  application:
    name: bedrock-adapter
  profiles:
    active: local
  main:
    banner-mode: off

server:
  port: 4516
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      group:
        # k8s readiness ignores the broker: MQ being down must not take the pod out of rotation
        # or every queue-manager failover cascades into a full restart (INC-2023-0142).
        readiness:
          include: ping,diskSpace

logging:
  config: classpath:log4j2-meridian.xml

meridian:
  security:
    jwks-uri: http://localhost:4400/.well-known/jwks.json
    issuer: http://localhost:4400
  mq:
    # IBM MQ developer container from mock-external. Switch to the embedded Artemis with
    # --spring.profiles.active=local,local-artemis. No code change either way; see MqConfig.
    host: localhost
    port: 1414
    queue-manager: QM1
    channel: DEV.APP.SVRCONN
    user: app
    password: CHANGEME-mq-app-password
    receive-timeout-ms: 5000
  bedrock:
    # mq | fixture | auto. See GatewayConfig. Helm values set mq.
    mode: auto
    # mq | http. http drives the bedrock-core-mock REST queue facade; the mock does not sit on IBM MQ
    # (mock-external/README.md, "Why Bedrock does not sit on MQ"). Helm values set mq.
    transport: http
    core-url: ${BEDROCK_CORE_URL:http://localhost:4600}
    request-queue: BEDROCK.REQ
    reply-queue: BEDROCK.RESP
  fixtures:
    path: ${MERIDIAN_FIXTURES:../../fixtures/meridian-fixtures.json}
