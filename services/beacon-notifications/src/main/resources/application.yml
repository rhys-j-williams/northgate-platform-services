spring:
  application:
    name: beacon-notifications
  profiles:
    active: local
  main:
    banner-mode: off
  datasource:
    # H2 in Oracle compatibility mode. The real datasource block is in application-prod.yml, commented out.
    url: jdbc:h2:mem:beacon;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      # none, not validate: Hibernate's H2 dialect reads NUMBER(19) back as numeric and refuses the
      # Flyway schema. Validation runs in the prod pipeline against a real Oracle (PLAT-0967).
      ddl-auto: none
    properties:
      hibernate.dialect: com.meridian.platform.common.jpa.LocalOracleDialect
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/oracle

server:
  port: 4510
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      group:
        # k8s readiness ignores the broker: MQ being down must not take the pod out of rotation
        # or every queue-manager failover cascades into a full restart (INC-2023-0142).
        readiness:
          include: ping,diskSpace

logging:
  config: classpath:log4j2-meridian.xml

meridian:
  security:
    jwks-uri: http://localhost:4400/.well-known/jwks.json
    issuer: http://localhost:4400
  mq:
    # IBM MQ developer container from mock-external. Switch to the embedded Artemis with
    # --spring.profiles.active=local,local-artemis. No code change either way; see MqConfig.
    host: localhost
    port: 1414
    queue-manager: QM1
    channel: DEV.APP.SVRCONN
    user: app
    password: CHANGEME-mq-app-password
    receive-timeout-ms: 5000
  beacon:
    events-queue: ACCT.EVENTS
    preferences-url: http://localhost:4511/preferences/v1
    fixture-fallback: true
    # How long an out-of-order event waits for the gap below it to fill. See ADR 0002.
    gap-timeout: PT30S
    gap-sweep-ms: 5000
  ldap:
    embedded-port: 0
  fixtures:
    path: ${MERIDIAN_FIXTURES:../../fixtures/meridian-fixtures.json}

# The starter's LDAP health check dials spring.ldap.urls (default localhost:389) which does not exist
# here; the embedded directory is on a random port. Admin auth is exercised by the smoke test instead.
management.health.ldap.enabled: false
