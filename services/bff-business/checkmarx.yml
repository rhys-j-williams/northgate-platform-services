# Consumed by the mock cx CLI in platform-tooling/mock-scanners/bin. Inherits the platform-services
# root checkmarx.yml; only the per-service overrides live here.
project:
  name: meridian-platform-services-bff-business
  team: /CxServer/Meridian/CSWT/business-digital
scan:
  preset: Meridian-High-And-Medium
  incremental: true
  language: typescript
  source: .
  exclude:
    - "node_modules"
    - "dist"
    - "coverage"
    - "**/*.spec.ts"
thresholds:
  high: 0
  medium: 5

report:
  formats: [json, html]
  output: .cx-reports
